services:
  # コンテナ：イメージを元に動く実行環境（webはPHP・Apache用、dbはMySQL用）。
  web:
    # PHP 8.4とApacheに、MySQL接続用の拡張を追加してビルドする。
    # imageの設定をDockerfileに写し、ビルド段階でDockerfileに書かれてるイメージをコマンド付きで実行
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    environment:
      DB_HOST: "db"
      DB_NAME: "${MYSQL_DATABASE}"
      DB_USER: "${MYSQL_USER}"
      DB_PASSWORD: "${MYSQL_PASSWORD}"
    ports:
      - "8080:80"
    volumes:
      # バインドマウント：手元のpublicフォルダをコンテナ内の公開フォルダと共有する。
      - "./public:/var/www/html"
      - "./src:/var/www/src:ro"

  db:
    # MySQL 8.4入りのイメージを元に、DB用コンテナを作る。
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
    volumes:
      # ボリューム：コンテナを削除してもDBデータを残せる、Docker管理の保存領域。
      - "db_data:/var/lib/mysql"
      # DB保存領域が空の初回起動時に、直下のSQLファイルを自動実行する。
      - "./database/:/docker-entrypoint-initdb.d/"
      # 接続とサーバーの既定文字コードをUTF-8にする。
      - "./docker/mysql/charset.cnf:/etc/mysql/conf.d/charset.cnf:ro"

volumes:
  # DBデータの保存に使う名前付きボリュームを定義する。
  db_data:
